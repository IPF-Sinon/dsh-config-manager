# 手动打包：跑与 ci.yml 完全相同的阶梯，然后把 tgz 挂到一个 pre-release 上。
#
# 为什么单独一条流水线而不是塞进 ci.yml：ci.yml 的设计是「零发布副作用、不申请仓库写权限」，
# 给它加 contents: write 会破坏这个不变量；publish.yml 又会真的往 registry 发版。
# 这里只做「构建 + 挂附件」，绝不 push 到任何 registry。
name: Pack test tarball (pre-release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the tarball to (e.g. v0.1.60-test.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pack-prerelease
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # 与 ci.yml/publish.yml 同一套安装契约：部分 @deepseek-ai/* 只在 peerDependencies
      # 且未发布到公共 registry，不带 --legacy-peer-deps 的 npm ci 会因 peer 解析失败红灯。
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package tarball
        run: mkdir -p dist && npm pack --pack-destination ./dist

      - name: Attach tarball to a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TGZ=$(ls dist/*.tgz | head -1)
          echo "tarball: $TGZ"
          # 已存在就先删掉旧附件，保证同一个 tag 反复跑时拿到的总是最新构建
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "$TAG" --notes "dsh-config-manager test build (not published to any registry)."
          gh release upload "$TAG" "$TGZ" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].url'
